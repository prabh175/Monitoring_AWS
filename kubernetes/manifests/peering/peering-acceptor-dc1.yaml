# Acceptor on dc1: generates a peering token into the named Kubernetes secret.
# Peer name in Consul matches metadata.name of this resource (see current CRD docs).
apiVersion: consul.hashicorp.com/v1alpha1
kind: PeeringAcceptor
metadata:
  name: dc2
  namespace: consul
spec:
  peer:
    secret:
      backend: kubernetes
      name: peering-token-dc2
      key: data
