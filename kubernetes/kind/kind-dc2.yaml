# Single-node kind cluster — pair with kind-dc1 for two logical datacenters (2 VMs total if one host per cluster).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dc2
networking:
  podSubnet: "10.220.0.0/16"
  serviceSubnet: "10.221.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=dc2"
