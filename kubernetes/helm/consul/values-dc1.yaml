# Consul Helm values — DC1 (Kubernetes). Pin chart version to match 1.8.x control plane.
# Corrections vs sample snippet: ui.service has no storageClass; that belongs on server PVCs.

global:
  enabled: true
  name: consul
  domain: consul
  datacenter: dc1
  image: hashicorp/consul-enterprise:1.21.6-ent-ubi
  imageK8S: hashicorp/consul-k8s-control-plane:1.8.3-ubi
  imageConsulDataplane: hashicorp/consul-dataplane:1.8.3-ubi
  imagePullSecrets: []
  enterpriseLicense:
    secretName: consul-enterprise-license
    secretKey: key
    enableLicenseAutoload: true
  tls:
    enabled: true
    httpsOnly: false
  acls:
    manageSystemACLs: true
  metrics:
    enabled: true
    enableAgentMetrics: true
    enableGatewayMetrics: true
    agentMetricsRetentionTime: "1m"
  peering:
    enabled: true

server:
  enabled: true
  replicas: 3
  # EKS: gp2 is the default StorageClass created by the EBS CSI driver add-on.
  # To use gp3 (cheaper/faster), apply the StorageClass from terraform/eks/README.md and change this value.
  storageClass: gp2
  extraConfig: |
    {
      "log_level": "TRACE"
    }

ui:
  enabled: true
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    provider: "prometheus"
    # With release name `kps` (see monitoring/README.md): kubectl get svc -n monitoring
    baseURL: "http://kps-kube-prometheus-prometheus.monitoring.svc:9090"

connectInject:
  enabled: true
  # Inherited chart default is usually true; set explicitly so behavior does not depend on chart version.
  # Redirects outbound/inbound pod traffic through Envoy so apps can use cluster DNS / virtual IPs without local_bind ports.
  transparentProxy:
    defaultEnabled: true
    defaultOverwriteProbes: true
  metrics:
    defaultEnabled: true
    defaultEnableMerging: true
    defaultMergedMetricsPort: "20100"
    # External Prometheus scrape (pod IP): 20200/metrics — see Consul observe/telemetry/k8s.
    defaultPrometheusScrapePort: "20200"
    defaultPrometheusScrapePath: "/metrics"
    # Metrics listeners are configured when merging is enabled — Prometheus scrapes 20200.
    # For custom app ports, teams must add:
    #   consul.hashicorp.com/transparent-proxy-exclude-inbound-ports: "<port>"
    # to their pod annotations, OR use the defaultToproxyExcludeInboundPorts below
    # to exclude a platform-wide set of ports.
    # defaultToproxyExcludeInboundPorts: "9090,8080"  # uncomment if needed globally
  apiGateway:
    manageExternalCRDs: true
    managedGatewayClass:
      serviceType: LoadBalancer

meshGateway:
  enabled: true
  replicas: 1
  wanAddress:
    # EKS: use the LoadBalancer hostname assigned by AWS. Consul registers this as the WAN address.
    source: Service
  service:
    type: LoadBalancer
    port: 443
    annotations: |
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
