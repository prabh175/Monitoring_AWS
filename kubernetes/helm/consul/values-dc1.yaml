# Consul Helm values — DC1 (Kubernetes). Pin chart version to match 1.8.x control plane.
# Corrections vs sample snippet: ui.service has no storageClass; that belongs on server PVCs.

global:
  enabled: true
  name: consul
  domain: consul
  datacenter: dc1
  image: hashicorp/consul-enterprise:1.21.6-ent-ubi
  imageK8S: hashicorp/consul-k8s-control-plane:1.8.3-ubi
  imageConsulDataplane: hashicorp/consul-dataplane:1.8.3-ubi
  imagePullSecrets: []
  enterpriseLicense:
    secretName: consul-enterprise-license
    secretKey: key
    enableLicenseAutoload: true
  tls:
    enabled: true
    httpsOnly: false
  acls:
    manageSystemACLs: true
  metrics:
    enabled: true
    enableAgentMetrics: true
    enableGatewayMetrics: true
    agentMetricsRetentionTime: "1m"
  peering:
    enabled: true

server:
  enabled: true
  replicas: 3
  # kind: use "standard" or "consul-local-path" (see manifests/storageclass-kind.yaml).
  # EKS/OpenShift: set to gp2, gp3, or your platform class.
  storageClass: standard
  extraConfig: |
    {
      "log_level": "TRACE"
    }

ui:
  enabled: true
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    provider: "prometheus"
    # With release name `kps` (see monitoring/README.md): kubectl get svc -n monitoring
    baseURL: "http://kps-kube-prometheus-prometheus.monitoring.svc:9090"

connectInject:
  enabled: true
  # Inherited chart default is usually true; set explicitly so behavior does not depend on chart version.
  # Redirects outbound/inbound pod traffic through Envoy so apps can use cluster DNS / virtual IPs without local_bind ports.
  transparentProxy:
    defaultEnabled: true
    defaultOverwriteProbes: true
  metrics:
    defaultEnabled: true
    defaultEnableMerging: true
    defaultMergedMetricsPort: "20100"
    defaultPrometheusScrapePath: "/metrics"
  apiGateway:
    manageExternalCRDs: true
    managedGatewayClass:
      serviceType: LoadBalancer

meshGateway:
  enabled: true
  # One replica is enough per cluster; runs as a pod on the same kind cluster as Consul and workloads.
  replicas: 1
  wanAddress:
    source: Service
  service:
    type: NodePort
    port: 443
    nodePort: 31443
