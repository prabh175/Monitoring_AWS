# kube-prometheus-stack — DC1: Prometheus + Grafana + Alertmanager
# Chart: prometheus-community/kube-prometheus-stack
# Install: helm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring -f kube-prometheus-stack-values.yaml

fullnameOverride: ""

defaultRules:
  create: true

alertmanager:
  enabled: true

grafana:
  enabled: true
  adminPassword: changeme
  persistence:
    enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    podMonitorNamespaceSelector: {}
    # Discover PodMonitors / ServiceMonitors cluster-wide (not only this Helm release).
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # Scrape pods annotated by Consul chart and others (prometheus.io/*).
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Consul servers: use PodMonitor + bearer token (ACL); avoid duplicate/failed scrapes here.
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: server
            action: drop
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          # Consul: annotation path is /v1/agent/metrics; add format=prometheus for scrape.
          - source_labels: [__metrics_path__]
            regex: ^/v1/agent/metrics$
            action: replace
            target_label: __metrics_path__
            replacement: /v1/agent/metrics?format=prometheus

      # ── VM datacenter scrape jobs ────────────────────────────────────────────
      # Replace the placeholder IPs with the private IPs from:
      #   cd terraform/vm-datacenter && terraform output
      # Open the following ports from the EKS node security group to the VM security group:
      #   9100 (node_exporter), 9107 (consul_exporter), 8500 (Consul agent), 19000 (Envoy admin)

      # Host metrics — all VM datacenter instances
      - job_name: vm-datacenter-node-exporter
        static_configs:
          - targets:
              - 10.0.X.X:9100   # consul-server VM private IP
              - 10.0.X.X:9100   # hashicups-postgres VM
              - 10.0.X.X:9100   # hashicups-product-api VM
              - 10.0.X.X:9100   # hashicups-payments VM
              - 10.0.X.X:9100   # hashicups-public-api VM
              - 10.0.X.X:9100   # hashicups-frontend VM
        labels:
          datacenter: dc-vm
          job: node-exporter

      # Consul catalog and health checks — consul-server VM only
      - job_name: vm-datacenter-consul-exporter
        static_configs:
          - targets:
              - 10.0.X.X:9107   # consul-server VM private IP
        labels:
          datacenter: dc-vm
          job: consul-exporter

      # Consul internal metrics (Raft, RPC) — both server and client agents
      - job_name: vm-datacenter-consul-agent-metrics
        metrics_path: /v1/agent/metrics
        params:
          format: [prometheus]
        # If ACLs are enabled add: bearer_token: <metrics-token>
        static_configs:
          - targets:
              - 10.0.X.X:8500   # consul-server VM
              - 10.0.X.X:8500   # hashicups-postgres VM (Consul client)
              - 10.0.X.X:8500   # hashicups-product-api VM
              - 10.0.X.X:8500   # hashicups-payments VM
              - 10.0.X.X:8500   # hashicups-public-api VM
              - 10.0.X.X:8500   # hashicups-frontend VM
        labels:
          datacenter: dc-vm
          job: consul-agent

      # Envoy sidecar metrics — one per HashiCups service VM (not the consul-server VM)
      # Requires --admin-bind 0.0.0.0:19000 in connect-envoy@.service (already set).
      - job_name: vm-datacenter-envoy-sidecars
        metrics_path: /stats/prometheus
        static_configs:
          - targets:
              - 10.0.X.X:19000  # hashicups-postgres Envoy
              - 10.0.X.X:19000  # hashicups-product-api Envoy
              - 10.0.X.X:19000  # hashicups-payments Envoy
              - 10.0.X.X:19000  # hashicups-public-api Envoy
              - 10.0.X.X:19000  # hashicups-frontend Envoy
        relabel_configs:
          # Use instance label to distinguish which service's Envoy this is
          - source_labels: [__address__]
            target_label: instance
        labels:
          datacenter: dc-vm
          job: envoy-sidecar

prometheusOperator:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
